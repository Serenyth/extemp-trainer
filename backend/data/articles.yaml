- title: 荷塘月色（节选）
  cat: 散文
  text: 曲曲折折的荷塘上面，弥望的是田田的叶子。叶子出水很高，像亭亭的舞女的裙。层层的叶子中间，零星地点缀着些白花，有袅娜地开着的，有羞涩地打着朵儿的；正如一粒粒的明珠，又如碧天里的星星，又如刚出浴的美人。微风过处，送来缕缕清香，仿佛远处高楼上渺茫的歌声似的。
- title: 春（节选）
  cat: 散文
  text: 盼望着，盼望着，东风来了，春天的脚步近了。一切都像刚睡醒的样子，欣欣然张开了眼。山朗润起来了，水涨起来了，太阳的脸红起来了。小草偷偷地从土里钻出来，嫩嫩的，绿绿的。园子里，田野里，瞧去，一大片一大片满是的。坐着，躺着，打两个滚，踢几脚球，赛几趟跑，捉几回迷藏。风轻悄悄的，草软绵绵的。
- title: 时间是怎样溜走的
  cat: 说理
  text: 时间是最公平的，也是最不公平的。公平在于，每个人每天都只有二十四小时；不公平在于，同样的一小时，有人能写完一份报告，有人只刷完了几十条短视频。差别不在时间本身，而在于注意力落在哪里。你以为自己在休息，其实是在被喂养；你以为自己在忙碌，其实只是在重复。真正把时间留住的办法只有一种：让它变成一件做完的东西。
- title: 给五年后的自己
  cat: 书信
  text: 你好，五年后的我。不知道你现在过得好不好，有没有活成当年想要的那种样子。如果答案是没有，也别太苛责自己。这五年里你做过很多选择，每一步在当时看起来都已经是你能想到的最好答案了。我只希望你保留两样东西：一是好奇心，二是承认错误的勇气。有了这两样，就算走错了路，也还能拐回来。
- title: 一句话的分量
  cat: 说理
  text: 同样一句话，说给不同的人听，分量完全不同。你熬夜做好的方案，在会上讲三十分钟，可能不如一句「这个能帮公司多赚多少钱」。不是内容不重要，而是听众需要先知道这件事和自己有什么关系。所以开口之前，先想清楚一句话：你希望听的人记住什么。想清楚这一句，剩下的话才站得住。
- title: 练习的意义
  cat: 说理
  text: 没有人第一次开口就能讲好。那些看起来从容的人，不过是把慌张藏在了你看不见的地方，或者在你看不见的时候，已经讲砸过很多次。练习不会让你变得完美，它只会把犯错的位置往前挪——从正式场合挪到练习场，从当着客户面挪到当着空房间。这就是练习全部的意义：让失败发生在便宜的时候。
