version: 1
categories:
  观点思辨:
  - 网络让人更自由，还是更不自由
  - 「躺平」是一种对抗，还是一种逃避
  - 能力越大，责任是否越大
  - 我们该不该给自己「断网」一天
  - 读万卷书与行万里路，哪个更重要
  - AI 时代，普通人最该保住的能力是什么
  - 「合群」重要还是「做自己」重要
  - 迟到的正义还算正义吗
  - 兴趣能不能当饭吃
  - 内向是一种缺点吗
  - 付费知识到底值不值得买
  - 如果所有人都说真话，世界会更好吗
  - 年轻人该攒钱，还是该投资自己
  - 完美主义是动力还是枷锁
  - 选择比努力更重要吗
  - 「断舍离」是自律还是另一种消费主义
  职场汇报:
  - 向团队做一个三分钟的自我介绍
  - 汇报你最近完成的一件工作
  - 说服领导采纳你的一个建议
  - 把你专业领域的一个概念讲给外行听
  - 描述一次你解决过的棘手问题
  - 如果由你当一天部门负责人
  - 给新同事讲「这个部门最要注意的三件事」
  - 为一个你不认同的方案做辩护
  - 向 HR 陈述给你调薪的三个理由
  - 项目延期了，如何向客户解释
  - 讲一个你犯过的错误和你的收获
  - 三分钟复盘你最近的一次合作
  - 在全员大会上提出一项流程改进
  - 说服团队接受一个不受欢迎的决定
  生活叙事:
  - 讲一个改变了你的瞬间
  - 描述你童年最深刻的一段记忆
  - 你最近一次开怀大笑是因为什么
  - 讲一位对你影响最大的人
  - 描述一座你想长住的城市
  - 你最珍视的一件物品及其来历
  - 讲一次你独自出行的经历
  - 你人生中做过最勇敢的决定
  - 描述一个你想再见一面的人
  - 讲讲你名字的来历
  - 如果明天完全自由，你会怎么过这一天
  - 讲一件你至今没想通的事
  - 描述一种让你安心的小仪式
  - 讲一段「当时不觉得、后来才懂」的时光
  知识讲解:
  - 用三分钟讲清你最喜欢的电影或书
  - 给完全不懂的人讲你的爱好
  - 讲一个你行业里人人都该知道的常识
  - 讲讲「复利」是什么
  - 天为什么是蓝色的
  - 讲清一个历史事件的来龙去脉
  - 解释「沉没成本」，并举一个例子
  - 用三分钟讲清你是怎么理财的
  - 介绍一道你最拿手的菜
  - 纠正一个常见的生活误区
  - 讲讲你最擅长的一项技能是怎么练成的
  - 用三分钟介绍一家你佩服的公司
  - 解释「机会成本」是什么意思
  - 讲清楚一个你最近学到的新知识
  认知思维:
  - 解释「确认偏误」，并说说怎么对抗它
  - 「幸存者偏差」如何扭曲我们的判断
  - 什么是「第一性原理」思维
  - 解释「沉没成本谬误」在生活中的三个例子
  - 为什么聪明人也会相信伪科学
  - 「奥卡姆剃刀」是什么，何时会失效
  - 解释「系统一」与「系统二」思维的区别
  - 什么是「元认知」，为什么它重要
  - 「相关不等于因果」——举一个反直觉的例子
  - 达克效应：为什么半桶水最响
  - 解释「可得性启发式」如何影响你的决策
  - 逆向思维什么时候比正向更有用
  - 为什么「简单解释」往往比「复杂解释」更可能是对的
  - 损失厌恶如何左右我们的选择
  - 什么是「灰度思维」，它和「和稀泥」的区别
  - 锚定效应：第一个数字如何绑架谈判
  - 解释「框架效应」：同一件事两种说法如何改变态度
  - 为什么说「我没想过」本身是一种思维结果
  心理洞察:
  - 解释「习得性无助」，以及如何走出来
  - 什么是「心流」，怎样更容易进入
  - 「冒名顶替综合征」：为什么优秀的人觉得自己不配
  - 依恋类型如何影响成年后的关系
  - 解释「认知失调」，举一个你自己的例子
  - 为什么「压抑情绪」往往适得其反
  - 什么是「情绪粒度」，说得清情绪有什么好处
  - 内在动机与外在动机，哪个更持久
  - 解释「投射」：我们如何把内心扔给别人
  - 为什么人在群体里会变得更极端
  - 「自我实现预言」如何塑造一个人的命运
  - 拖延的本质是懒吗
  - 解释「边界感」，以及如何说「不」
  - 什么是「反刍思维」，如何打断它
  - 安慰剂效应说明了心理的什么能力
  - 为什么「被理解」比「被夸奖」更治愈
  - 解释「酸葡萄与甜柠檬」的心理机制
  - 高敏感是一种缺陷还是一种特质
