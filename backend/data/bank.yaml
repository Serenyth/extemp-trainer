version: 1
categories:
  观点思辨:
  - 网络让人更自由，还是更不自由
  - 「躺平」是一种对抗，还是一种逃避
  - 能力越大，责任是否越大
  - 我们该不该给自己「断网」一天
  - 读万卷书与行万里路，哪个更重要
  - AI 时代，普通人最该保住的能力是什么
  - 「合群」重要还是「做自己」重要
  - 迟到的正义还算正义吗
  - 兴趣能不能当饭吃
  - 内向是一种缺点吗
  - 付费知识到底值不值得买
  - 如果所有人都说真话，世界会更好吗
  - 年轻人该攒钱，还是该投资自己
  - 完美主义是动力还是枷锁
  - 选择比努力更重要吗
  - 「断舍离」是自律还是另一种消费主义
  职场汇报:
  - 向团队做一个三分钟的自我介绍
  - 汇报你最近完成的一件工作
  - 说服领导采纳你的一个建议
  - 把你专业领域的一个概念讲给外行听
  - 描述一次你解决过的棘手问题
  - 如果由你当一天部门负责人
  - 给新同事讲「这个部门最要注意的三件事」
  - 为一个你不认同的方案做辩护
  - 向 HR 陈述给你调薪的三个理由
  - 项目延期了，如何向客户解释
  - 讲一个你犯过的错误和你的收获
  - 三分钟复盘你最近的一次合作
  - 在全员大会上提出一项流程改进
  - 说服团队接受一个不受欢迎的决定
  心理效应:
  - 巴纳姆效应
  - 达克效应（越无知越自信）
  - 幸存者偏差
  - 沉没成本谬误
  - 锚定效应
  - 破窗效应
  - 信息茧房与回音室效应
  - 鸟笼逻辑
  - 羊群效应（从众心理）
  - 延迟满足
  - 习得性无助
  - 认知失调
  - 晕轮效应（光环效应）
  - 旁观者效应
  - 峰终定律
  人际沟通:
  - 如何优雅地拒绝别人的请求
  - 怎样与三观不合的同事共事
  - 朋友借钱不还，如何体面地开口要
  - 第一次约会如何避免冷场
  - 如何在饭局上得体地挡酒/敬酒
  - 如何安慰一个正在经历低谷的朋友
  - 怎样向伴侣表达需求，而不是单纯抱怨
  - 亲戚过度干涉你的私生活怎么办
  - 如何在微信群里优雅地终止尴尬的话题
  - 如何给一个比你级别高很多的人提意见
  - 被当众批评时，该如何高情商回应
  - 如何在不伤感情的情况下结束一段友谊
  - 怎样识别身边正在向你「隐性攻击」的人
  - 如何应对喜欢「打断别人说话」的人
  - 如何向一个你不喜欢的人求助
  面试实战:
  - 请描述你过去五年内最大的职业挫折
  - 你最大的缺点是什么？（如何巧妙回答）
  - 为什么你从上一家公司离职？
  - 你未来三到五年的职业规划是什么？
  - 如果你的上级做出了一个错误的决定，你会怎么做？
  - 描述一次你成功说服他人接受你观点的经历
  - 讲一个你和团队成员发生严重冲突的故事
  - 你如何看待加班？
  - 如果录用你，你能为公司带来什么独特的价值？
  - 你觉得自己在哪个方面最需要提升？
  - 我们为什么要在一众候选人中选择你？
  - 描述一次你在极大压力下完成的任务
  - 如果入职后发现工作内容与预期不符，你会怎么办？
  - 你期望的薪资是多少？你的定价依据是什么？
  - 你有什么问题想问我们的吗？
  商业法则:
  - 边际成本
  - 机会成本
  - 护城河理论
  - 劣币驱逐良币
  - 鲶鱼效应
  - 长尾理论
  - 凡勃伦效应（炫耀性消费）
  - 帕累托法则（二八定律）
  - 蓝海战略
  - 黑天鹅与灰犀牛
  - 囚徒困境
  - 价格歧视
  - 口红效应
  - 禀赋效应
  自我管理:
  - 如何建立属于自己的「知识管理系统」
  - 为什么我们总是「间歇性踌躇满志，持续性混吃等死」
  - 怎样戒掉睡前的「报复性熬夜」
  - 独处的能力为什么越来越重要
  - 如何构建自己的「反脆弱」能力
  - 极简主义生活真的适合所有人吗
  - 怎样区分「欲望」和「真实的需求」
  - 如何克服错失恐惧症（FOMO）
  - 建立微习惯比设定大目标更有效吗
  - 怎样培养自己的「深度工作」能力
  - 年龄焦虑的本质是什么
  - 如何面对同辈压力（Peer pressure）
  - 怎样找到一件愿意为之坚持十年的事
  - 如何科学地对抗拖延症
  - 多巴胺与内啡肽的区别及获取方式
  思想实验:
  - 如果你能拥有一项超能力，但只能用来做家务，你会选什么
  - 如果人类不再需要睡眠，世界会发生什么变化
  - 如果你的记忆可以像硬盘一样随意删除和备份，你会删掉哪段记忆
  - 如果你可以和历史上的任何一个人共进晚餐，你会选谁
  - 如果世界上所有的谎言都会立刻变成现实
  - 如果你可以预知自己确切的生命终点，你会如何度过剩下的时间
  - 如果世界上所有的动物都能说话，哪种动物最毒舌
  - 如果给你一千万，代价是永远不能再使用互联网
  - 如果你的人生是一部电影，现在的你在经历什么类型的桥段
  - 如果外星人降临地球，让你用一道菜代表人类文明，你会做什么菜
